services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: saga
      POSTGRES_PASSWORD: saga
      POSTGRES_DB: postgres
    volumes:
      - ./infra/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saga"]
      interval: 5s
      retries: 20
  kafka:
    image: apache/kafka:3.8.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports: ["9092:9092"]
  payment-service:
    build: ./payment-service
    environment: {DB_URL: "jdbc:postgresql://postgres:5432/paymentdb"}
    depends_on: {postgres: {condition: service_healthy}}
    ports: ["8082:8082"]
  inventory-service:
    build: ./inventory-service
    environment: {DB_URL: "jdbc:postgresql://postgres:5432/inventorydb"}
    depends_on: {postgres: {condition: service_healthy}}
    ports: ["8083:8083"]
  shipping-service:
    build: ./shipping-service
    environment: {DB_URL: "jdbc:postgresql://postgres:5432/shippingdb"}
    depends_on: {postgres: {condition: service_healthy}}
    ports: ["8084:8084"]
  order-service:
    build: ./order-service
    environment:
      DB_URL: "jdbc:postgresql://postgres:5432/orderdb"
      PAYMENT_URL: "http://payment-service:8082"
      INVENTORY_URL: "http://inventory-service:8083"
      SHIPPING_URL: "http://shipping-service:8084"
      KAFKA_BOOTSTRAP: "kafka:9092"
    depends_on:
      postgres: {condition: service_healthy}
      payment-service: {condition: service_started}
      inventory-service: {condition: service_started}
      shipping-service: {condition: service_started}
      kafka: {condition: service_started}
    ports: ["8081:8081"]
volumes:
  pgdata:
