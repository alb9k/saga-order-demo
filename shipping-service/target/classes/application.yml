server:
  port: 8084
spring:
  application:
    name: shipping-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shippingdb}
    username: ${DB_USER:saga}
    password: ${DB_PASSWORD:saga}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
